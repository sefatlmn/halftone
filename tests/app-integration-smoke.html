<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App integration smoke test</title>
    <style>
      body { margin: 0; background: #181410; color: #f2eee4; font: 13px/1.4 system-ui, sans-serif; }
      header { display: flex; gap: 18px; align-items: center; padding: 10px 16px; }
      h1 { margin: 0; font-size: 15px; text-transform: uppercase; letter-spacing: .08em; }
      #status { font-weight: 800; }
      iframe { display: block; width: 100%; height: calc(100vh - 46px); border: 0; background: #f2eee4; }
      .pass { color: #67d79a; }
      .fail { color: #ff8176; }
    </style>
  </head>
  <body>
    <header>
      <h1>Real app animated-media integration</h1>
      <span id="status">Running…</span>
    </header>
    <iframe id="app" src="../index.html"></iframe>
    <script type="module">
      import { encodeGif, preferredWebMMime, recordCanvasWebM } from "../src/animated-export.js";
      import { makeDisposal2Gif, makeDisposal3Gif } from "./gif-fixtures.js";

      const status = document.querySelector("#status");
      const iframe = document.querySelector("#app");
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const until = async (test, message, timeout = 15000) => {
        const started = performance.now();
        while (!test()) {
          if (performance.now() - started > timeout) throw new Error(message);
          await wait(30);
        }
      };
      const assert = (value, message) => {
        if (!value) throw new Error(message);
      };
      const pixel = (source, x, y) => source.canvas.getContext("2d").getImageData(x, y, 1, 1).data;
      const assertPixel = (source, x, y, expected, message) => {
        const actual = pixel(source, x, y);
        assert(
          expected.every((value, index) => actual[index] === value),
          `${message}: expected ${expected.join(",")}, got ${Array.from(actual).join(",")}`,
        );
      };
      const solid = (r, g, b) => {
        const bytes = new Uint8Array(24 * 24 * 4);
        for (let i = 0; i < bytes.length; i += 4) {
          bytes[i] = r; bytes[i + 1] = g; bytes[i + 2] = b; bytes[i + 3] = 255;
        }
        return bytes;
      };

      async function makeGif() {
        async function* frames() {
          yield { rgba: solid(238, 55, 40), delay: 80, progress: 0.5 };
          yield { rgba: solid(20, 85, 225), delay: 80, progress: 1 };
        }
        return encodeGif({ width: 24, height: 24, frames: frames() });
      }

      async function makeVideo() {
        const canvas = document.createElement("canvas");
        canvas.width = 120; canvas.height = 90;
        const ctx = canvas.getContext("2d");
        let timer;
        return recordCanvasWebM({
          canvas,
          duration: 0.3,
          fps: 12,
          play: () => new Promise((resolve) => {
            const started = performance.now();
            timer = setInterval(() => {
              const elapsed = performance.now() - started;
              ctx.fillStyle = elapsed % 120 < 60 ? "#ef4434" : "#155bd6";
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              if (elapsed >= 300) resolve();
            }, 25);
          }),
          stop: () => clearInterval(timer),
        });
      }

      function selectFile(win, file) {
        const transfer = new win.DataTransfer();
        transfer.items.add(new win.File([file], file.name, { type: file.type }));
        const input = win.document.querySelector("#file-input");
        input.files = transfer.files;
        input.dispatchEvent(new win.Event("change", { bubbles: true }));
      }

      try {
        await new Promise((resolve) => iframe.addEventListener("load", resolve, { once: true }));
        const win = iframe.contentWindow;
        const doc = win.document;
        await until(() => win.__hp?.p, "p5 did not initialize.");
        const downloads = [];
        win.HTMLAnchorElement.prototype.click = function () {
          if (this.download) downloads.push(this.download);
        };

        const gifBlob = await makeGif();
        gifBlob.name = "integration.gif";
        selectFile(win, gifBlob);
        await until(() => win.__hp.mediaKind === "gif" && win.__hp.mediaPlaying, "GIF did not load and play.");
        assert(!doc.querySelector("#media-controls").hidden, "Playback controls stayed hidden.");
        const firstVersion = win.__hp.mediaVersion;
        await wait(180);
        assert(win.__hp.mediaVersion > firstVersion, "Processed GIF frames did not advance.");
        doc.querySelector("#media-play").click();
        assert(!win.__hp.mediaPlaying, "Pause control did not pause.");
        doc.querySelector("#btn-export").click();
        assert(doc.querySelector("#xbtn-animated").textContent.includes("GIF"), "GIF export option is missing.");
        doc.querySelector("#xbtn-animated").click();
        await until(() => !win.__hp.exportBusy && downloads.some((name) => name.endsWith(".gif")), "GIF export did not finish.");

        const oldGif = win.__hp.mediaSource;
        const disposal3Blob = makeDisposal3Gif();
        disposal3Blob.name = "integration-disposal-3.gif";
        selectFile(win, disposal3Blob);
        await until(
          () => win.__hp.mediaSource !== oldGif && win.__hp.mediaKind === "gif" && win.__hp.mediaPlaying,
          "Disposal 3 GIF did not load and play.",
        );
        assert(oldGif.canvas.width === 1, "Initial GIF resources were not released.");
        const disposal3Source = win.__hp.mediaSource;
        await disposal3Source.seek(0.21);
        assertPixel(disposal3Source, 1, 1, [235, 40, 35, 255], "Disposal 3 transparent restore");
        assertPixel(disposal3Source, 2, 1, [40, 175, 90, 255], "Disposal 3 opaque patch");
         await disposal3Source.seek(0.11);
         assertPixel(disposal3Source, 1, 1, [30, 85, 225, 255], "Backward disposal 3 seek");

        const disposal2Blob = makeDisposal2Gif();
        disposal2Blob.name = "integration-disposal-2.gif";
        selectFile(win, disposal2Blob);
        await until(
          () => win.__hp.mediaSource !== disposal3Source && win.__hp.mediaKind === "gif" && win.__hp.mediaPlaying,
          "Disposal 2 GIF did not load and play.",
        );
        assert(disposal3Source.canvas.width === 1, "Replaced disposal 3 resources were not released.");
        const disposal2Source = win.__hp.mediaSource;
        await disposal2Source.seek(0.21);
        assertPixel(disposal2Source, 1, 1, [0, 0, 0, 0], "Disposal 2 cleared region");
        assertPixel(disposal2Source, 3, 0, [235, 40, 35, 255], "Transparent patch over prior content");
         assertPixel(disposal2Source, 4, 0, [40, 175, 90, 255], "Disposal 2 opaque patch");
         assertPixel(disposal2Source, 4, 1, [235, 40, 35, 255], "Disposal 2 prior content");
         await disposal2Source.seek(0.11);
         assertPixel(disposal2Source, 1, 1, [30, 85, 225, 255], "Backward disposal 2 seek");

        if (preferredWebMMime()) {
          const videoBlob = await makeVideo();
          videoBlob.name = "integration.webm";
          selectFile(win, videoBlob);
          await until(
            () => win.__hp.mediaSource !== disposal2Source && win.__hp.mediaKind === "video" && win.__hp.mediaPlaying,
            "Video did not load and play.",
          );
          assert(disposal2Source.canvas.width === 1, "Replaced disposal 2 resources were not released.");
          doc.querySelector("#media-loop").checked = false;
          doc.querySelector("#media-loop").dispatchEvent(new win.Event("change", { bubbles: true }));
          assert(!win.__hp.mediaSource.loop, "Loop control did not update the video.");
          doc.querySelector("#btn-export").click();
          assert(doc.querySelector("#xbtn-animated").textContent.includes("WebM"), "WebM export option is missing.");
          doc.querySelector("#xbtn-animated").click();
          await until(() => !win.__hp.exportBusy && downloads.some((name) => name.endsWith(".webm")), "WebM export did not finish.");
        }

        status.textContent = preferredWebMMime()
          ? "PASS — load, playback, controls, cleanup, GIF and WebM exports"
          : "PASS — load, playback, controls, cleanup, GIF export";
        status.className = "pass";
        document.title = "PASS — app integration smoke";
         window.__smokeFailures = 0;
         window.__smokeDone = true;
      } catch (error) {
        status.textContent = `FAIL — ${error.message}`;
        status.className = "fail";
        document.title = "FAIL — app integration smoke";
        console.error(error);
         window.__smokeFailures = 1;
         window.__smokeDetails = error.stack || String(error);
         window.__smokeDone = true;
      }
    </script>
  </body>
</html>
