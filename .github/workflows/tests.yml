name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: npm test (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          # Headroom for shared-runner variance; the local budget is 50 ms.
          EFFECT_BUDGET_MS: "100"
